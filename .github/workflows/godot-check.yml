name: Godot check

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Import project (catches parse/import errors)
        run: godot --headless --editor --quit --path .
